<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Blauwerk × The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #f7f8fb; --ink: #0b1433; --sub: #7a829c; --blue: #1f45e6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .top { position: fixed; top: 28px; left: 0; right: 0; z-index: 10; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 15px; }
  .top a { color: inherit; text-decoration: none; font-family: "Instrument Serif", Georgia, serif; font-size: 19px; }
  .top i { font-style: normal; color: var(--sub); font-size: 12px; }
  .top b { font-weight: 700; letter-spacing: -.03em; font-size: 17px; }
  .back { position: fixed; top: 30px; left: 28px; z-index: 10; font-size: 13px; color: var(--sub); text-decoration: none; }
  .back:hover { color: var(--ink); }
  .count { position: fixed; top: 30px; right: 28px; z-index: 10; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .stage { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  .stage.drag { cursor: grabbing; }
  .ring { position: absolute; left: 50%; top: 44%; }
  .item { position: absolute; left: 0; top: 0; width: 170px; margin-left: -85px; margin-top: -160px; cursor: pointer; will-change: transform; }
  .item canvas { display: block; width: 100%; aspect-ratio: 512/712; box-shadow: 0 18px 40px -22px rgba(11,20,51,.4); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .item:hover canvas { transform: translateY(-8px); }
  .item .cap { margin-top: 14px; font-size: 11px; line-height: 1.45; color: var(--sub); }
  .item .cap em { display: block; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 17px; color: var(--ink); line-height: 1.1; margin-bottom: 4px; }
  .foot { position: fixed; left: 50%; bottom: 5.5vh; transform: translateX(-50%); width: min(520px, 90vw); text-align: center; z-index: 10; }
  .foot h1 { font-weight: 500; font-size: 15px; letter-spacing: -.01em; }
  .foot p { margin-top: 12px; font-size: 13px; line-height: 1.55; color: var(--sub); }
  .ln-mask { display: block; overflow: clip; } .ln { display: block; }
  /* lightbox */
  .lb { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: auto 320px; gap: 56px; align-items: center; justify-content: center; background: rgba(247,248,251,.94); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity .45s; }
  .lb.on { opacity: 1; pointer-events: auto; }
  .lb canvas { height: min(74vh, 720px); width: auto; aspect-ratio: 512/712; box-shadow: 0 40px 80px -40px rgba(11,20,51,.5); transform: translateY(20px) scale(.96); transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .lb.on canvas { transform: none; }
  .lb .info em { display: block; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 44px; line-height: 1; }
  .lb .info dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin-top: 28px; font-size: 13px; }
  .lb .info dt { color: var(--sub); }
  .lb .info q { display: block; margin-top: 26px; font-size: 15px; line-height: 1.45; color: #384063; }
  .lb .close { position: absolute; top: 28px; right: 28px; font: 400 13px Inter, sans-serif; background: none; border: 0; color: var(--sub); cursor: pointer; }
  .ver { position: fixed; left: 16px; bottom: 16px; z-index: 99; font: 600 11px Inter, sans-serif; letter-spacing: .06em; padding: 6px 10px; border-radius: 999px; background: #0b1433; color: #fff; }
  @media (max-width: 760px) { .back { font-size: 0; } .back::before { content: '←'; font-size: 20px; color: var(--ink); } .count { display: none; } .top { top: 24px; } .foot p .ln { display: inline; } .foot { bottom: 4vh; } .lb { grid-template-columns: 1fr; gap: 20px; padding: 20px; } .lb canvas { height: 50vh; } .item { width: 140px; margin-left: -70px; margin-top: -130px; } }
</style>
</head>
<body>
<a class="back" href="index.html">← Back to Blauwerk</a>
<div class="top"><a href="index.html">Blauwerk</a><i>×</i><b>The Archive</b></div>
<div class="count" id="count">001 / 030</div>
<div class="stage" id="stage"><div class="ring" id="ring"></div></div>
<div class="foot">
  <h1><span class="ln-mask"><span class="ln">Edition 04 · 1,200 posters from 64 countries</span></span></h1>
  <p><span class="ln-mask"><span class="ln">A first room of the full wall. Drag, scroll or use the arrow keys</span></span><span class="ln-mask"><span class="ln">to walk around — click any poster to look closer.</span></span></p>
</div>
<div class="lb" id="lb"><button class="close" id="lbClose">Close ✕</button><canvas id="lbCanvas"></canvas><div class="info" id="lbInfo"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
/* ================= posters (blue palette) ================= */
const NAVY = '#0a1a4a', COBALT = '#1f45e6', ICE = '#dfe7ff', SKY = '#6fa3ff', PAPER = '#f5f7fd', CYAN = '#38c6ff', DEEP = '#06102e';
const designs = [
  { bg: DEEP,   title: 'Deep\nField', style: 'orb' },
  { bg: COBALT, title: 'Tide',        style: 'duo', duo: [NAVY, SKY] },
  { bg: ICE,    title: 'Azul',        style: 'photoTop', duo: [NAVY, ICE] },
  { bg: PAPER,  title: 'Blue\nHour',  style: 'circles' },
  { bg: PAPER,  title: 'Quiet\nVoices\nCarry', style: 'editorial', duo: [COBALT, PAPER] },
  { bg: COBALT, title: 'B',           style: 'bigLetter', duo: [NAVY, SKY] },
  { bg: SKY,    title: 'Undertow',    style: 'waves' },
  { bg: NAVY,   title: '',            style: 'photoFull', duo: [DEEP, SKY] },
  { bg: NAVY,   title: 'Indigo',      style: 'duo', duo: [DEEP, COBALT] },
  { bg: ICE,    title: 'Glass',       style: 'photoTop', duo: [COBALT, ICE] },
  { bg: COBALT, title: '',            style: 'photoFull', duo: [NAVY, CYAN] },
  { bg: DEEP,   title: 'Kobalt\n27',  style: 'orb' },
  { bg: PAPER,  title: 'Wave\nForm',  style: 'waves' },
  { bg: NAVY,   title: 'Ø',           style: 'bigLetter', duo: [DEEP, COBALT] },
  /* v12 additions */
  { bg: PAPER,  title: 'Common\nGround', style: 'swiss' },
  { bg: COBALT, title: 'Signal\nLost',  style: 'halftone' },
  { bg: ICE,    title: 'Arches',        style: 'arch' },
  { bg: NAVY,   title: 'LISTEN',        style: 'bigword' },
  { bg: SKY,    title: 'Low\nTide',     style: 'stripes' },
  { bg: PAPER,  title: 'Second\nLanguage', style: 'typeTop', duo: [NAVY, SKY] },
  { bg: DEEP,   title: 'Night\nSwim',   style: 'horizon' },
  { bg: ICE,    title: 'Open\nWindow',  style: 'window', duo: [NAVY, ICE] },
  { bg: PAPER,  title: 'A—Z',           style: 'alphabet' },
  { bg: PAPER,  title: 'Ripple',        style: 'rings' },
  { bg: DEEP,   title: 'The Long\nQueue', style: 'queue' },
  { bg: ICE,    title: 'Kite',          style: 'kite' },
  { bg: COBALT, title: 'Two\nCities',   style: 'split', duo: [DEEP, SKY] },
  { bg: COBALT, title: 'Grain',         style: 'grain' },
];
const CW = 512, CH = 712;

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function duotone(ctx, x, y, w, h, dark, light) {
  try {
    const d = ctx.getImageData(x, y, w, h), a = hex(dark), b = hex(light), px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      const l = Math.pow((px[i] * .3 + px[i + 1] * .59 + px[i + 2] * .11) / 255, 1.1);
      px[i] = a[0] + (b[0] - a[0]) * l; px[i + 1] = a[1] + (b[1] - a[1]) * l; px[i + 2] = a[2] + (b[2] - a[2]) * l;
    }
    ctx.putImageData(d, x, y);
  } catch (e) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = light; ctx.fillRect(x, y, w, h); ctx.restore(); }
}

function drawPoster(ctx, d, img) {
  ctx.save();
  ctx.fillStyle = d.bg; ctx.fillRect(0, 0, CW, CH);
  const photo = (x, y, w, h, duo) => {
    if (!img) { const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, duo ? duo[1] : SKY); g.addColorStop(1, duo ? duo[0] : NAVY); ctx.fillStyle = g; ctx.fillRect(x, y, w, h); return; }
    const s = Math.max(w / img.width, h / img.height), iw = img.width * s, ih = img.height * s;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih); ctx.restore();
    if (duo) duotone(ctx, x, y, w, h, duo[0], duo[1]);
  };
  const small = (txt, x, y, col = '#fff', a = 'left') => { ctx.font = '600 13px Inter, sans-serif'; ctx.fillStyle = col; ctx.textAlign = a; ctx.fillText(txt, x, y); };
  const lines = (txt, x, y, size, col, weight = 700, lh = .95) => {
    ctx.font = `${weight} ${size}px Inter, sans-serif`; ctx.fillStyle = col; ctx.textAlign = 'left';
    txt.split('\n').forEach((l, i) => ctx.fillText(l, x, y + i * size * lh));
  };
  const footer = col => { ctx.fillStyle = col; ctx.fillRect(36, CH - 40, CW - 72, 1.5); small('BLAUWERK 27', 36, CH - 16, col); small('№ ' + (100 + (d.title.length * 37) % 900), CW - 36, CH - 16, col, 'right'); };

  switch (d.style) {
    case 'orb': {
      const g = ctx.createRadialGradient(CW * .5, CH * .42, 6, CW * .5, CH * .42, CW * .6);
      g.addColorStop(0, '#d6f3ff'); g.addColorStop(.12, CYAN); g.addColorStop(.38, COBALT); g.addColorStop(.75, '#0b1a66'); g.addColorStop(1, DEEP);
      ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
      ctx.strokeStyle = 'rgba(180,220,255,.35)'; ctx.lineWidth = 1;
      for (let r = 60; r < 400; r += 34) { ctx.beginPath(); ctx.arc(CW * .5, CH * .42, r, 0, Math.PI * 2); ctx.stroke(); }
      lines(d.title, 36, CH - 150, 74, '#fff', 600, .95);
      small('EXHIBITION', 36, 50, '#cfe0ff');
      footer('#cfe0ff');
      break;
    }
    case 'duo':
      photo(0, 0, CW, CH, d.duo);
      lines(d.title, 30, CH - 70, 116, '#fff', 700, 1);
      small('OPEN CALL 2027', 34, 48);
      break;
    case 'photoTop':
      photo(0, 150, CW, CH - 150, d.duo);
      lines(d.title, 30, 118, 104, NAVY, 600, 1);
      small('ISSUE 04', CW - 30, 40, NAVY, 'right');
      break;
    case 'circles': {
      const cols = [COBALT, SKY, NAVY, CYAN];
      for (let i = 0; i < 9; i++) { ctx.fillStyle = cols[i % 4]; ctx.beginPath(); ctx.arc(110 + (i % 3) * 146, 110 + ((i / 3) | 0) * 146, 64, 0, Math.PI * (i % 2 ? 1 : 2)); ctx.fill(); }
      lines(d.title, 36, CH - 170, 78, NAVY, 700, .95);
      footer(NAVY);
      break;
    }
    case 'editorial':
      lines(d.title, 30, 92, 72, NAVY, 700, .98);
      ctx.fillStyle = COBALT; ctx.fillRect(30, 420, 200, 200);
      photo(250, 320, CW - 250, CH - 320, d.duo);
      small('THE INTERVIEW', CW - 30, 40, NAVY, 'right');
      break;
    case 'bigLetter':
      photo(CW * .4, 0, CW * .6, CH, d.duo);
      ctx.font = '800 620px Inter, sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
      ctx.fillText(d.title, -30, CH - 70);
      break;
    case 'waves': {
      const dark = d.bg === PAPER;
      for (let k = 0; k < 16; k++) {
        ctx.strokeStyle = dark ? (k % 3 ? COBALT : CYAN) : (k % 2 ? '#fff' : NAVY); ctx.lineWidth = 5;
        ctx.beginPath();
        for (let x = 0; x <= CW; x += 8) { const y = 70 + k * 30 + Math.sin(x / 50 + k * .5) * 18; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
      }
      lines(d.title, 34, CH - 110, 70, dark ? NAVY : '#fff', 700, .95);
      footer(dark ? NAVY : '#fff');
      break;
    }
    case 'photoFull':
      photo(0, 0, CW, CH, d.duo);
      small('FIELD NOTES — LISBON', 30, 46);
      break;
    /* ---------- v12: fourteen more poster styles ---------- */
    case 'swiss': {
      const cols = [COBALT, NAVY, SKY, ICE, CYAN];
      for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) {
        const k = (r * 7 + c * 3 + d.title.length) % 6;
        if (k > 3) continue;
        ctx.fillStyle = cols[k]; ctx.fillRect(36 + c * 110, 40 + r * 92, 100, 82);
      }
      lines(d.title, 36, CH - 120, 64, NAVY, 700, .95);
      footer(NAVY);
      break;
    }
    case 'halftone': {
      for (let y = 20; y < CH - 150; y += 18) for (let x = 16; x < CW; x += 18) {
        const dd = Math.hypot(x - CW * .62, y - CH * .36) / 340, rr = Math.max(0, 7.5 * (1 - dd));
        if (rr < .4) continue;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, rr, 0, 6.283); ctx.fill();
      }
      lines(d.title, 34, CH - 110, 70, '#fff', 700, .95);
      small('RADIO EDITION', 34, CH - 20, ICE);
      break;
    }
    case 'arch': {
      const cols = [COBALT, SKY, NAVY, CYAN, '#fff'];
      for (let k = 0; k < 5; k++) {
        const w = 400 - k * 70, x = (CW - w) / 2, top = 120 + k * 52;
        ctx.fillStyle = cols[k]; ctx.beginPath(); ctx.moveTo(x, CH - 150); ctx.lineTo(x, top + w / 2); ctx.arc(CW / 2, top + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w, CH - 150); ctx.closePath(); ctx.fill();
      }
      lines(d.title, 36, CH - 70, 64, NAVY, 700, .95);
      break;
    }
    case 'bigword': {
      ctx.save(); ctx.translate(CW - 40, 40); ctx.rotate(Math.PI / 2);
      ctx.font = '800 190px Inter, sans-serif'; ctx.fillStyle = COBALT; ctx.textAlign = 'left';
      ctx.fillText(d.title, 0, 0); ctx.restore();
      ctx.font = '800 190px Inter, sans-serif'; ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(CW - 210, 40); ctx.rotate(Math.PI / 2); ctx.fillText(d.title, 0, 0); ctx.restore();
      small('A SOUND PIECE IN PRINT', 34, CH - 30, ICE);
      break;
    }
    case 'stripes': {
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, CW, CH - 170); ctx.clip();
      for (let k = -CH; k < CW + CH; k += 44) { ctx.fillStyle = k % 88 ? NAVY : '#fff'; ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + 22, 0); ctx.lineTo(k + 22 - CH, CH); ctx.lineTo(k - CH, CH); ctx.fill(); }
      ctx.restore();
      lines(d.title, 34, CH - 92, 70, NAVY, 700, .95);
      footer(NAVY);
      break;
    }
    case 'typeTop':
      photo(0, 0, CW, CH * .58, d.duo);
      lines(d.title, 30, CH * .58 + 96, 82, NAVY, 700, .95);
      small('ESSAY NO. 3', CW - 30, CH - 24, NAVY, 'right');
      break;
    case 'horizon': {
      const g = ctx.createLinearGradient(0, 0, 0, CH); g.addColorStop(0, DEEP); g.addColorStop(.62, COBALT); g.addColorStop(.63, NAVY); g.addColorStop(1, DEEP);
      ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
      ctx.fillStyle = '#d6f3ff'; ctx.beginPath(); ctx.arc(CW * .5, CH * .62, 110, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(214,243,255,.35)'; for (let k = 0; k < 8; k++) ctx.fillRect(CW * .5 - 110 + k * 6, CH * .64 + k * 14, 220 - k * 12, 4);
      lines(d.title, 34, 110, 74, '#fff', 600, .95);
      break;
    }
    case 'window': {
      photo(60, 80, CW - 120, CH - 300, d.duo);
      ctx.strokeStyle = d.bg === NAVY ? ICE : NAVY; ctx.lineWidth = 14;
      ctx.strokeRect(60, 80, CW - 120, CH - 300);
      ctx.beginPath(); ctx.moveTo(CW / 2, 80); ctx.lineTo(CW / 2, CH - 220); ctx.moveTo(60, 80 + (CH - 300) / 2); ctx.lineTo(CW - 60, 80 + (CH - 300) / 2); ctx.stroke();
      lines(d.title, 60, CH - 130, 58, d.bg === NAVY ? '#fff' : NAVY, 700, .95);
      break;
    }
    case 'alphabet': {
      const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      ctx.font = '700 62px Inter, sans-serif'; ctx.textAlign = 'center';
      for (let k = 0; k < 25; k++) { ctx.fillStyle = k % 6 === 2 ? COBALT : (k % 4 === 0 ? SKY : NAVY); ctx.fillText(L[k], 70 + (k % 5) * 93, 110 + ((k / 5) | 0) * 96); }
      lines(d.title, 36, CH - 76, 70, COBALT, 800, .95);
      break;
    }
    case 'rings': {
      for (let k = 9; k > 0; k--) { ctx.fillStyle = k % 2 ? COBALT : ICE; ctx.beginPath(); ctx.arc(CW * .42 + k * 6, CH * .4, k * 28, 0, 6.283); ctx.fill(); }
      lines(d.title, 34, CH - 110, 76, NAVY, 700, .95);
      footer(NAVY);
      break;
    }
    case 'queue': {
      for (let k = 0; k < 9; k++) {
        const x = 40 + k * 50, h = 150 + (k * 37 % 70);
        ctx.fillStyle = k === 6 ? COBALT : (d.bg === DEEP ? SKY : NAVY);
        ctx.beginPath(); ctx.arc(x + 16, CH * .55 - h - 20, 15, 0, 6.283); ctx.fill();
        ctx.fillRect(x, CH * .55 - h, 32, h);
      }
      ctx.fillStyle = d.bg === DEEP ? 'rgba(255,255,255,.2)' : 'rgba(11,26,74,.2)'; ctx.fillRect(30, CH * .55, CW - 60, 2);
      lines(d.title, 34, CH - 150, 66, d.bg === DEEP ? '#fff' : NAVY, 700, .95);
      break;
    }
    case 'kite': {
      ctx.fillStyle = COBALT; ctx.beginPath(); ctx.moveTo(CW * .55, 60); ctx.lineTo(CW * .85, 250); ctx.lineTo(CW * .55, 420); ctx.lineTo(CW * .3, 250); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = NAVY; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(CW * .55, 420);
      for (let k = 1; k < 8; k++) ctx.lineTo(CW * .55 + Math.sin(k) * 34, 420 + k * 28); ctx.stroke();
      lines(d.title, 34, CH - 100, 74, NAVY, 700, .95);
      footer(NAVY);
      break;
    }
    case 'split':
      photo(0, 0, CW / 2, CH, d.duo);
      ctx.fillStyle = d.bg; ctx.fillRect(CW / 2, 0, CW / 2, CH);
      ctx.save(); ctx.translate(CW * .76, CH - 40); ctx.rotate(-Math.PI / 2);
      lines(d.title, 0, 0, 92, '#fff', 800, .95); ctx.restore();
      small('DIPTYCH', CW / 2 + 24, 46);
      break;
    case 'grain': {
      const g = ctx.createLinearGradient(0, 0, CW, CH); g.addColorStop(0, CYAN); g.addColorStop(.5, COBALT); g.addColorStop(1, DEEP);
      ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
      for (let k = 0; k < 5000; k++) { ctx.fillStyle = `rgba(255,255,255,${Math.random() * .18})`; ctx.fillRect(Math.random() * CW, Math.random() * CH, 1.5, 1.5); }
      lines(d.title, 34, CH - 110, 76, '#fff', 700, .95);
      small('RISO · TWO DRUMS', 34, 46, ICE);
      break;
    }
  }
  ctx.restore();
}

const imgs = [], waiters = designs.map(() => []);
designs.forEach((d, i) => { const img = new Image(); img.crossOrigin = 'anonymous'; img.onload = () => { imgs[i] = img; waiters[i].forEach(f => f()); }; img.src = `https://picsum.photos/seed/blau${i * 11 + 5}/600/820?grayscale`; });
function paint(cv, di) {
  cv.width = CW; cv.height = CH;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const draw = () => drawPoster(ctx, designs[di], imgs[di] || null);
  draw(); if (!imgs[di]) waiters[di].push(draw);
  document.fonts && document.fonts.ready.then(draw);
}

const NAMES = ['Mira Okafor', 'Joon Park', 'Inês Duarte', 'Studio Halde', 'Oksana Hrytsenko', 'Felix Brandt', 'Ana Ruiz', 'Kenji Sato', 'Léa Moreau', 'Studio Vær', 'Tomás Vega', 'Nora Lind', 'Amara Eze', 'Yuki Tanabe', 'Rafael Couto', 'Ingrid Solberg', 'Diego Llano', 'Priya Raman'];
const CITYS = ['Lagos', 'Busan', 'Lisbon', 'Oslo', 'Kyiv', 'Berlin', 'Mexico City', 'Tokyo', 'Lyon', 'Copenhagen', 'Bogotá', 'Bergen', 'Accra', 'Seoul', 'São Paulo', 'Reykjavík', 'Mumbai', 'Cairo'];
const TECH = ['Screen print', 'Risograph', 'Offset', 'Letterpress', 'Cyanotype', 'Inkjet'];
const TITLES = ['Deep Field', 'Tide', 'Azul', 'Blue Hour', 'Quiet Voices Carry', 'B', 'Undertow', 'Night Shift', 'Indigo', 'Glass', 'Low Tide', 'Kobalt 27', 'Wave Form', 'Ø', 'Open Window', 'Common Ground', 'Second Language', 'The Long Queue'];
const DTITLES = ['Deep Field', 'Tide', 'Azul', 'Blue Hour', 'Quiet Voices Carry', 'B', 'Undertow', 'Field Notes', 'Indigo', 'Glass', 'Night Swim', 'Kobalt 27', 'Wave Form', 'Ø'];
const N = 30, STEP = 360 / N;
const items = Array.from({ length: N }, (_, i) => {
  const d = (i * 11) % designs.length;
  const data = { d, t: designs[d].title.replace(/\n/g, ' ') || DTITLES[d % DTITLES.length], by: NAMES[(i * 7) % NAMES.length], city: CITYS[(i * 5) % CITYS.length], y: 2025 + (i % 2), tech: TECH[i % TECH.length], n: i + 1 };
  const el = document.createElement('div'); el.className = 'item';
  el.innerHTML = `<canvas></canvas><div class="cap"><em>${data.t}</em>${data.by}<br>${data.city}, ${data.y}<br>${data.tech}</div>`;
  document.getElementById('ring').appendChild(el);
  el.addEventListener('click', () => { if (!moved && !lbOpen) openLb(data); });
  paint(el.querySelector('canvas'), d);
  return { el, data, a: i * STEP, k: 0 };
});

/* rotation: wheel / drag / keys, with inertia and a slow drift */
let rot = 0, target = 0, dragging = false, lastX = 0, downX = 0, moved = false, vel = 0;
const stage = document.getElementById('stage');
addEventListener('wheel', e => { target -= (e.deltaY + e.deltaX) * .05; }, { passive: true });
stage.addEventListener('pointerdown', e => { dragging = true; moved = false; lastX = downX = e.clientX; stage.classList.add('drag'); });
addEventListener('pointermove', e => { if (!dragging) return; const dx = e.clientX - lastX; lastX = e.clientX; if (Math.abs(e.clientX - downX) > 8) moved = true; target += dx * .12; vel = dx * .12; });
addEventListener('pointerup', () => { dragging = false; stage.classList.remove('drag'); target += vel * 6; vel = 0; setTimeout(() => moved = false, 0); });
addEventListener('keydown', e => { if (e.key === 'ArrowRight') target -= STEP; if (e.key === 'ArrowLeft') target += STEP; if (e.key === 'Escape') closeLb(); });

const intro = { k: 0 };
gsap.to(intro, { k: 1, duration: 2.4, ease: 'power3.out', delay: .2 });
gsap.fromTo('.ln', { yPercent: 110 }, { yPercent: 0, duration: 1.2, stagger: .08, ease: 'power4.out', delay: .6 });
const ring = document.getElementById('ring'), countEl = document.getElementById('count');
function tick() {
  if (!dragging && !lbOpen) target -= .015;
  rot = lerp(rot, target, .08);
  const K = innerWidth < 760 ? 820 : Math.min(1000, innerWidth * .7);   // phones: wider spacing so ~3 posters show   // recomputed every frame so resizing just works
  let best = 0, bestD = 1e9;
  items.forEach((it, i) => {
    let a = ((it.a + rot) % 360 + 540) % 360 - 180;        // -180..180, 0 = straight ahead
    const vis = Math.abs(a) < 42;
    it.el.style.visibility = vis ? 'visible' : 'hidden';
    if (!vis) return;
    const k = clamp(intro.k * 1.6 - Math.abs(a) / 42 * .6);
    const enter = (1 - k) * 40 * Math.sign(a || 1);
    // panoramic projection: as if hung on the inside of a cylinder around the viewer
    const ar = (a + enter) * Math.PI / 180, sc = 1 / Math.cos(ar);
    // v10: the edges lean in much harder — steeper turn, stronger perspective, a slight tilt and drop
    const ae = a + enter, edge = Math.pow(Math.abs(ae) / 42, 1.4);
    const turn = clamp(-ae * (1.4 + edge * 1.4), -78, 78);
    it.el.style.transform = `translateX(${K * Math.tan(ar)}px) translateY(${edge * 46}px) scale(${Math.pow(sc, 1.6)}) perspective(560px) rotateY(${turn}deg) rotateZ(${ae * .14}deg)`;
    it.el.style.zIndex = Math.round(Math.abs(a));
    it.el.style.opacity = k * clamp((42 - Math.abs(a)) / 10);
    if (Math.abs(a) < bestD) { bestD = Math.abs(a); best = i; }
  });
  countEl.textContent = `${String(best + 1).padStart(3, '0')} / ${String(N).padStart(3, '0')}`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* lightbox */
const lb = document.getElementById('lb'); let lbOpen = false;
function openLb(d) {
  paint(document.getElementById('lbCanvas'), d.d);
  document.getElementById('lbInfo').innerHTML = `<em>${d.t}</em><dl><dt>Designer</dt><dd>${d.by}</dd><dt>City</dt><dd>${d.city}</dd><dt>Year</dt><dd>${d.y}</dd><dt>Print</dt><dd>${d.tech}</dd><dt>Wall №</dt><dd>${String(d.n).padStart(4, '0')}</dd></dl><q>A poster has three seconds to stop a stranger. This one was printed for exactly that.</q>`;
  lb.classList.add('on'); lbOpen = true;
}
function closeLb() { lb.classList.remove('on'); lbOpen = false; }
lb.addEventListener('click', e => { if (e.target === lb || e.target.id === 'lbClose') closeLb(); });
</script>
</body>
</html>
